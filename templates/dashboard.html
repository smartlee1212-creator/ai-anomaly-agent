<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Anomaly Agent - Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { margin: 0; color: #38bdf8; font-size: 1.5rem; }
        .logout { background: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; color: #38bdf8; }
        .metric { font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .chat-box { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; height: 180px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; color: #cbd5e1; }
        .status-banner { background: #0284c7; padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>AI Anomaly Agent Dashboard</h1>
        <a href="{{ url_for('logout') }}" class="logout">Log Out</a>
    </header>

    <div id="status-banner" class="status-banner">Loading live market telemetry...</div>

    <div class="grid">
        <div class="card">
            <h3>Bitcoin (BTC)</h3>
            <div id="btc-price" class="metric">--</div>
            <div id="btc-change">Change: --</div>
        </div>
        <div class="card">
            <h3>Ethereum (ETH)</h3>
            <div id="eth-price" class="metric">--</div>
            <div id="eth-change">Change: --</div>
        </div>
    </div>

    <div class="card">
        <h3>Agent Intelligence & Analysis Briefing</h3>
        <div id="ai-analysis" class="chat-box">Connecting to Gemini agent interface...</div>
    </div>

    <script>
        async function fetchTelemetry() {
            try {
                let response = await fetch('/api/telemetry');
                let data = await response.json();
                
                document.getElementById('btc-price').innerText = "$" + data.btc_price;
                let btcChangeEl = document.getElementById('btc-change');
                btcChangeEl.innerText = "24h Change: " + data.btc_change;
                btcChangeEl.className = data.btc_change.startsWith("+") ? "positive" : "negative";

                document.getElementById('eth-price').innerText = "$" + data.eth_price;
                let ethChangeEl = document.getElementById('eth-change');
                ethChangeEl.innerText = "24h Change: " + data.eth_change;
                ethChangeEl.className = data.eth_change.startsWith("+") ? "positive" : "negative";

                document.getElementById('status-banner').innerText = "Status: " + data.status;
                document.getElementById('ai-analysis').innerText = data.analysis;
            } catch (err) {
                console.error("Telemetry fetch error:", err);
            }
        }

        fetchTelemetry();
        setInterval(fetchTelemetry, 15000);
    </script>
</body>
</html>
