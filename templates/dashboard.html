<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Anomaly Agent - Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { margin: 0; color: #38bdf8; font-size: 1.5rem; }
        .logout { background: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #38bdf8; }
        .metric { font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .status-banner { background: #0284c7; padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; }
        .chat-container { display: flex; flex-direction: column; height: 250px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 15px; font-family: monospace; font-size: 0.9rem; }
        .message { margin-bottom: 10px; line-height: 1.4; }
        .user-msg { color: #38bdf8; }
        .agent-msg { color: #4ade80; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
        .chat-input-row button { padding: 10px 20px; background: #0284c7; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .chat-input-row button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <header>
        <h1>AI Anomaly Agent Dashboard</h1>
        <a href="{{ url_for('logout') }}" class="logout">Log Out</a>
    </header>

    <div id="status-banner" class="status-banner">Loading system metrics...</div>

    <div class="grid">
        <div class="card" style="margin-bottom:0;">
            <h3>Bitcoin (BTC)</h3>
            <div id="btc-price" class="metric">--</div>
            <div id="btc-change">Change: --</div>
        </div>
        <div class="card" style="margin-bottom:0;">
            <h3>Ethereum (ETH)</h3>
            <div id="eth-price" class="metric">--</div>
            <div id="eth-change">Change: --</div>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>Interactive Agent Command Center</h3>
        <div id="chat-box" class="chat-container">
            <div class="message agent-msg">System: Connected to Anomaly Agent core. Type a command or ask for market analysis below.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="user-input" placeholder="Ask agent to analyze trends or check anomalies..." onkeydown="if(event.key === 'Enter') sendChatMessage()">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <script>
        async function fetchTelemetry() {
            try {
                let response = await fetch('/api/telemetry');
                let data = await response.json();
                
                document.getElementById('btc-price').innerText = "$" + data.btc_price;
                let btcChangeEl = document.getElementById('btc-change');
                btcChangeEl.innerText = "24h Change: " + data.btc_change;
                btcChangeEl.className = data.btc_change.startsWith("+") ? "positive" : "negative";

                document.getElementById('eth-price').innerText = "$" + data.eth_price;
                let ethChangeEl = document.getElementById('eth-change');
                ethChangeEl.innerText = "24h Change: " + data.eth_change;
                ethChangeEl.className = data.eth_change.startsWith("+") ? "positive" : "negative";

                document.getElementById('status-banner').innerText = "Status: " + data.status;
            } catch (err) {
                console.error("Telemetry fetch error:", err);
            }
        }

        async function sendChatMessage() {
            let inputField = document.getElementById('user-input');
            let chatBox = document.getElementById('chat-box');
            let messageText = inputField.value.trim();
            
            if(!messageText) return;

            // Append User Message
            chatBox.innerHTML += `<div class="message user-msg">You: ${messageText}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Append Loading Indicator
            let loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message agent-msg" id="${loadingId}">Agent: Analyzing data...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                let response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                let data = await response.json();
                
                document.getElementById(loadingId).innerText = `Agent: ${data.response}`;
            } catch (err) {
                document.getElementById(loadingId).innerText = `Agent: Error processing request.`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        fetchTelemetry();
        setInterval(fetchTelemetry, 15000);
    </script>
</body>
</html>
